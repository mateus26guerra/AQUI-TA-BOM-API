spring.application.name=aqui-ta-bom-backend
server.port=8080

# ---- Banco (Neon PostgreSQL) ----
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Neon serverless: pool pequeno e conexoes de vida curta
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.max-lifetime=280000

# ---- JWT ----
# Segredo Base64 (>= 32 bytes). Gere com: openssl rand -base64 32
security.jwt.secret=${JWT_SECRET}
security.jwt.expiration=8h


# ---- Cloudflare R2 ----
cloudflare.r2.account-id=${R2_BUCKET}
cloudflare.r2.access-key=${R2_ACCESS_KEY}
cloudflare.r2.secret-key=${R2_SECRET_KEY}
cloudflare.r2.bucket-name=${R2_ENDPOINT}
cloudflare.r2.public-url=${R2_PUBLIC_URL}


r2.bucket=${R2_BUCKET}
r2.endpoint=${R2_ENDPOINT}

