spring.application.name=aqui-ta-bom-backend
server.port=8080
# Formulário de restaurante é multipart: cada campo e cada forma de pagamento marcada é uma "parte".
# O padrão do Tomcat (10) recusava o cadastro com várias formas de pagamento.
server.tomcat.max-part-count=100

# ---- Banco (Neon PostgreSQL) ----
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Neon serverless: pool pequeno e conexoes de vida curta
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.max-lifetime=280000

# ---- JWT ----
# Segredo Base64 (>= 32 bytes). Gere com: openssl rand -base64 32
security.jwt.secret=${JWT_SECRET}
security.jwt.expiration=8h
# Refresh token: mantém o usuário logado. Renova a cada uso, então só expira se ficar esse tempo sem abrir o app
security.jwt.refresh-expiration=90d

# ---- Recomendação de postagens (serviço de NLP) ----
recomendacao.url=${RECOMMENDER_URL:https://recommender-3h81.onrender.com}
recomendacao.timeout=10s

# ---- Login com Google ----
# ID do cliente OAuth do tipo "Aplicativo da Web" (não é segredo)
security.google.client-id=${GOOGLE_CLIENT_ID:772419967351-vhqsbjbrbvg0ec05tfmmvsa1pbdk98vp.apps.googleusercontent.com}


# ---- Cloudflare R2 ----
cloudflare.r2.account-id=${R2_BUCKET}
cloudflare.r2.access-key=${R2_ACCESS_KEY}
cloudflare.r2.secret-key=${R2_SECRET_KEY}
cloudflare.r2.bucket-name=${R2_ENDPOINT}
cloudflare.r2.public-url=${R2_PUBLIC_URL}


r2.bucket=${R2_BUCKET}
r2.endpoint=${R2_ENDPOINT}

